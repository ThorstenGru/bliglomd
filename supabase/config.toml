# Each edge function's gateway-level JWT requirement, made explicit so a plain
# `supabase functions deploy <name>` can never silently reset it to the CLI
# default (verify_jwt = true) again. These must stay false because their
# caller can never present a Supabase session JWT:
#   - stripe-webhook: called by Stripe's servers, authenticated via the
#     stripe-signature header (verified inside the function) instead.
#   - cleanup-unconfirmed, admin-weekly-digest, admin-monthly-report,
#     admin-weekly-db-dump, send-reminders, send-followups: called only by
#     pg_cron via net.http_post, authenticated via a per-function bearer
#     secret stored in Supabase Vault (verified inside each function) instead.
# Everything else is invoked by a logged-in user via supabase.functions.invoke()
# and must keep gateway JWT enforcement on.
#
# (Breach checking for the Trace scan flow no longer goes through an edge
# function at all -- see src/lib/breachCheck.ts. It calls XposedOrNot's free,
# CORS-enabled endpoints directly from the browser, since their bot-protection
# blocks server-side/datacenter callers, including Supabase's, on the richer
# endpoint a backend proxy would otherwise use.)

[functions.stripe-webhook]
verify_jwt = false

[functions.cleanup-unconfirmed]
verify_jwt = false

[functions.admin-weekly-digest]
verify_jwt = false

[functions.admin-monthly-report]
verify_jwt = false

[functions.admin-weekly-db-dump]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.send-followups]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.send-request]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
